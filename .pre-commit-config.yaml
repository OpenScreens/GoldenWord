repos:
-   repo: local
    hooks:
        -   id: testing-hook
            name: Test Flask Hook
            entry: python3 src/test/testflask.py
            language: system
            types: [python]
            pass_filenames: false
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    -   id: black
