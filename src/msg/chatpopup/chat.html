<<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>chat-popup</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            *{
                font-family:Verdana, Geneva, Tahoma, sans-serif;
            }
            body{
                background-color: black;
            }
            .open-button {
                background-color: #474948;
                color: white    ;
                border-radius: 60px;
                border: none;
                cursor: pointer;
                position: fixed;
                bottom: 23px;
                right: 28px;
                width: 60px;
                height: 60px;
            }

            .chat-popup {
                display: none;
                position: fixed;
                bottom: 0;
                right: 15px;
                z-index: 9;
            }

            .form-container {
                max-width: 300px;
                padding: 10px;
                background-color: white;
                border-radius: 14px;

            }

            .form-container h3 {
                text-align: center;
            }

            .form-container .message {
                max-height: 200px;
                overflow-y: auto;
                margin-bottom: 10px;
                padding: 10px;
                background-color: #f9f9f9;
            }

            .form-container .message .user-msg {
                text-align: right;
                background-color: #d1e7dd;
                padding: 5px;
                margin: 5px 0;
                border-radius: 5px;
            }

            .form-container .message .response-msg {
                text-align: left;
                background-color: #f8d7da;
                padding: 5px;
                margin: 5px 0;
                border-radius: 5px;
            }

            .form-container textarea {
                width: 100%;
                padding: 10px;
                margin: 5px 0 10px 0;
                border: 1px solid #ccc;
                background: #f1f1f1;
                resize: none;
                min-height: 50px;
            }

            .form-container .btn {
                background-color: #4CAF50;
                color: white;
                padding: 10px;
                border: none;
                cursor: pointer;
                width: 49%;
                margin-bottom: 10px;
                opacity: 0.8;
            }

            .form-container .cancel {
                background-color: red;
            }

            .form-container .btn:hover, .open-button:hover {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <button class="open-button" onclick="openForm()">Help</button>

        <div class="chat-popup" id="myForm">
            <form action="/form" class="form-container" onsubmit="return sendMessage(event)">
                <h3>Chat</h3>
        
                <div class="message" id="messageContainer">
                    
                </div>
                <textarea placeholder="Type message.." name="msg" id="userMessage" required></textarea>
        
                <button type="submit" class="btn">Send</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
            </form>
        </div>
        <script>
            function openForm() {
                document.getElementById("myForm").style.display = "block";
            }

            function closeForm() {
                document.getElementById("myForm").style.display = "none";
            }

            function generateUserId() {
                return 'user_' + Math.random().toString(36).substr(2, 9);
            }

            let userId = generateUserId();

            function sendMessage(event) {
                event.preventDefault();
                const messageContainer = document.getElementById("messageContainer");
                const userMessage = document.getElementById("userMessage").value;

                const userMessageElement = document.createElement("div");
                userMessageElement.className = "user-msg";
                userMessageElement.innerText = userMessage;
                messageContainer.appendChild(userMessageElement);
            
                fetch("http://localhost:5000/", {
                    method: "POST",
                    body: JSON.stringify({
                    user_input: userMessage,
                    user_id: userId
                    }),
                    headers: {
                    "Content-type": "application/json"
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(json => {
                    const responseMessageElement = document.createElement("div");
                    responseMessageElement.className = "response-msg";
                    responseMessageElement.innerText = json.response;
                    messageContainer.appendChild(responseMessageElement);
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                })
                .catch((error) => {
                    console.error('Error:', error);
                    const errorMessageElement = document.createElement("div");
                    errorMessageElement.className = "error-msg";
                    errorMessageElement.innerText = "An error occurred while sending the message. Please try again.";
                    messageContainer.appendChild(errorMessageElement);
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                });

                document.getElementById("userMessage").value = "";
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }
        </script>
    </body>
</html>
