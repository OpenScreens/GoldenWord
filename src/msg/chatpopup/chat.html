<<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>chat-popup</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <button class="open-button" onclick="openForm()">Help</button>

        <div class="chat-popup" id="myForm">
            <form action="/form" class="form-container" onsubmit="return sendMessage(event)">
                <h3>Chat</h3>
        
                <div class="message" id="messageContainer">
                    
                </div>
                <textarea placeholder="Type message.." name="msg" id="userMessage" required></textarea>
        
                <button type="submit" class="btn">Send</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
            </form>
        </div>
        <script src="script.js"></script>
    </body>
</html>
